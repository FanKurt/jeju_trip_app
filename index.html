/* ---------- Trip day calculator ---------- */
// 旅遊期間 2026/5/21 – 5/25,依當下日期判斷顯示哪一天
function tripDayInfo() {
  const start = new Date(2026, 4, 21); // 月份 0-indexed,4 = May
  start.setHours(0, 0, 0, 0);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - start) / 86400000);
  if (diff < 0) return { idx: 0, phase: 'pre',  daysUntil: -diff };
  if (diff > 4) return { idx: 4, phase: 'post' };
  return { idx: diff, phase: 'live' };
}

/* ---------- localStorage hook (with versioned key) ---------- */
const STORAGE_VERSION = 'v2'; // 改 schema 時 bump,自動丟棄舊資料避免畫面壞
function useLocalState(rawKey, initial) {
  const key = `${rawKey}.${STORAGE_VERSION}`;
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

/* ---------- Common pieces ---------- */
function Pill({ children, kind }) {

function ImgPlaceholder({ label, h = 110, tone = 'sea' }) {
  const bg = tone === 'citrus'
    ? 'repeating-linear-gradient(-45deg, var(--citrus-100) 0 8px, rgba(244,197,138,0.5) 8px 16px)'
    : undefined;
  return <div className="imgph" style={{ height: h, background: bg }}>{label}</div>;
}

function Donut({ data, size = 110 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = size / 2 - 12;
  const c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-soft)" strokeWidth="14" />
      {data.map((d, i) => {
        const len = (d.value / total) * c;
        const dash = `${len} ${c - len}`;
        const offset = c - acc;
        acc += len;
        return (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
            stroke={d.color} strokeWidth="14" strokeDasharray={dash}
            strokeDashoffset={offset} transform={`rotate(-90 ${size/2} ${size/2})`} strokeLinecap="butt" />
        );
      })}
    </svg>
  );
}

/* ---------- Toast ---------- */
function Toast({ msg, kind, onDone }) {
  useEffect(() => {
    if (!msg) return;
    const t = setTimeout(onDone, 1800);
    return () => clearTimeout(t);
  }, [msg, onDone]);
  if (!msg) return null;
  return <div className={`toast ${kind || ''}`} role="status" aria-live="polite">{msg}</div>;
}

/* ---------- Pack Edit/Add Modal ---------- */
function PackEditModal({ initial, onClose, onSave, onDelete }) {
  const [text, setText] = useState(initial || '');
  const isEdit = initial != null;
  const submit = () => {
    const t = text.trim();
    if (!t) return;
    onSave(t);
  };
  return (
    <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-labelledby="pack-title">
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-body">
          <h2 id="pack-title" style={{ margin: '0 0 14px', fontSize: 18 }}>
            {isEdit ? '修改項目' : '新增項目'}
          </h2>
          <div className="field">
            <label>項目名稱</label>
            <input value={text} onChange={(e) => setText(e.target.value)} autoFocus
              placeholder="例:防曬乳"
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}/>
          </div>
        </div>
        <div className="actions">
          <button className="btn btn-soft" onClick={onClose}>取消</button>
          {isEdit && (
            <button className="btn" style={{ background: 'var(--danger)', color: '#fff' }}
              onClick={onDelete}>刪除</button>
          )}
          <button className="btn btn-primary" onClick={submit} disabled={!text.trim()}>
            {isEdit ? '儲存' : '新增'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Shop Edit/Add Modal ---------- */
function ShopEditModal({ initial, categories, defaultCat, onClose, onSave, onDelete }) {
  const isEdit = initial != null;
  const [name, setName] = useState(initial?.name || '');
  const [est, setEst] = useState(initial?.est || '');
  const [where, setWhere] = useState(initial?.where || '');
  const [cat, setCat] = useState(initial?.cat || defaultCat || categories[0]);
  const submit = () => {
    if (!name.trim()) return;
    onSave(cat, {
      name: name.trim(),
      est: est.trim() || '—',
      where: where.trim() || '—',

    <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-labelledby="shop-title">

          </div>
          <div className="field">

          </div>

          </div>

/* ---------- Confirm Modal ---------- */
function ConfirmModal({ title, body, confirmText = '確認', cancelText = '取消', kind = 'primary', onConfirm, onClose }) {

/* ---------- App Context ---------- */
const AppCtx = React.createContext(null);

function AppProvider({ children }) {
  const T = window.TRIP;

  const [expenses, setExpenses] = useLocalState('jeju.expenses', T.expenses);
  const [shopping, setShopping] = useLocalState('jeju.shopping', T.shopping);
  const [packList, setPackList] = useLocalState('jeju.pack', T.notices.pack);
  const [budget, setBudget] = useLocalState('jeju.budget', T.budget);
  const [rate] = useLocalState('jeju.rate', T.rate);

  const [tab, setTab] = useState('home');
  const [route, setRoute] = useState({ name: 'tab' });
  const [toast, setToastState] = useState({ msg: '', kind: '' });

  const showToast = useCallback((msg, kind = '') => setToastState({ msg, kind }), []);
  const goTab = useCallback((id) => { setTab(id); setRoute({ name: 'tab' }); }, []);
  const openDay = useCallback((dayN) => setRoute({ name: 'dayDetail', day: dayN }), []);
  const openStop = useCallback((dayN, stopIdx) => setRoute({ name: 'stopDetail', day: dayN, stop: stopIdx }), []);
  const goBack = useCallback(() => setRoute({ name: 'tab' }), []);

  const togglePack = (idx) => {
    setPackList(prev => prev.map((p, i) => i === idx ? { ...p, done: !p.done } : p));
  };
  const addPackItem = (t) => {
    setPackList(prev => [...prev, { t, done: false }]);
    showToast('已新增項目');
  };
  const editPackItem = (idx, t) => {
    setPackList(prev => prev.map((p, i) => i === idx ? { ...p, t } : p));
    showToast('已更新');
  };
  const deletePackItem = (idx) => {
    setPackList(prev => prev.filter((_, i) => i !== idx));
    showToast('已刪除');
  };

  const toggleShop = (id) => {
    setShopping(prev => prev.map(g => ({
      ...g,
      items: g.items.map(it => it.id === id
        ? { ...it, done: !it.done, who: !it.done ? '自己' : undefined }
        : it),
    })));
  };

  const addExpense = (e) => {
    setExpenses(prev => [...prev, { ...e, id: Date.now() }]);
    showToast('已新增花費');
  };
  const deleteExpense = (id) => {
    setExpenses(prev => prev.filter(e => e.id !== id));
    showToast('已刪除');
  };

  const addShopItem = (cat, item) => {
    setShopping(prev => prev.map(g => g.cat === cat
      ? { ...g, items: [...g.items, { ...item, id: 's' + Date.now(), done: false }] }
      : g));
    showToast('已新增必買項目');
  };
  const editShopItem = (id, fields) => {
    setShopping(prev => prev.map(g => ({
      ...g,
      items: g.items.map(it => it.id === id ? { ...it, ...fields } : it),
    })));
    showToast('已更新');
  };
  const deleteShopItem = (id) => {
    setShopping(prev => prev.map(g => ({
      ...g,
      items: g.items.filter(it => it.id !== id),
    })));
    showToast('已刪除');
  };

  const value = {
    T, expenses, shopping, packList, budget, rate,
    tab, goTab, route, openDay, openStop, goBack,
    togglePack, addPackItem, editPackItem, deletePackItem,
    toggleShop, addShopItem, editShopItem, deleteShopItem,
    addExpense, deleteExpense,
    setBudget, showToast,
  };

  return (
    <AppCtx.Provider value={value}>
      {children}
      <Toast msg={toast.msg} kind={toast.kind} onDone={() => setToastState({ msg: '', kind: '' })} />
    </AppCtx.Provider>
  );
}

const useApp = () => React.useContext(AppCtx);

/* ---------- Stop Detail ---------- */
function StopDetailScreen({ dayN, stopIdx }) {
  const { T, openDay, openStop } = useApp();
  const d = T.days.find(x => x.n === dayN);
  const s = d?.stops[stopIdx];
  const [imgError, setImgError] = useState(false);

  // 上下站(只算非 flight)
  const navStops = (d?.stops || []).map((x, i) => ({ x, i })).filter(o => o.x.type !== 'flight');
  const cur = navStops.findIndex(o => o.i === stopIdx);
  const prev = cur > 0 ? navStops[cur - 1] : null;
  const next = cur >= 0 && cur < navStops.length - 1 ? navStops[cur + 1] : null;

  // reset 圖片狀態當切換景點
  useEffect(() => { setImgError(false); }, [dayN, stopIdx]);

  if (!s) {
    return (
      <div className="app screen-fade">
        <div className="app-content">
          <div className="empty">
            <div className="em-title">找不到此景點</div>
            <button className="btn btn-soft" onClick={() => openDay(dayN)} style={{ marginTop: 12 }}>
              返回 Day {dayN}
            </button>
          </div>
        </div>
      </div>
    );
  }

  const typeLabel = s.type === 'sight' ? '景點'
                  : s.type === 'shop'  ? '購物'

                background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(8px)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',

                <div style={{ width: 30, height: 30 }}>{

        {/* Title block */}
        <div style={{ padding: '20px 20px 0' }}>
          <div className="num" style={{ fontSize: 11, fontWeight: 600, color: 'var(--sea-700)',
            letterSpacing: '0.12em', marginBottom: 6 }}>
            DAY {d.n} · {d.date} · {s.time}

                      color: 'var(--citrus-700)', display: 'flex',
                      alignItems: 'center', justifyContent: 'center',
                      fontSize: 12, fontWeight: 700 }}>!</span>
                    <span style={{ flex: 1 }}>{t}</span>
                  </li>
                ))}

                    <div style={{ fontSize: 13, color: 'var(--ink-soft)', lineHeight: 1.5 }}>
                      {s.address}
                    </div>
                  </div>
                )}
                {s.mapUrl && (
                  <button className="btn btn-soft"
                    onClick={() => window.open(s.mapUrl, '_blank', 'noopener,noreferrer')}
                    style={{ width: '100%' }}>
                    在 Google Maps 開啟
                  </button>
                )}
              </div>
            </div>
          </>
        )}

        {/* 上下站導航 */}
        {(prev || next) && (
          <div style={{ display: 'flex', gap: 10, padding: '20px 16px 8px' }}>
            {prev ? (
              <button className="btn btn-soft" style={{ flex: 1, padding: '10px 12px',

              </button>

        )}

        <div style={{ height: 24 }}/>
      </div>
    </div>
  );

          onConfirm={() => { deleteExpense(pendingDelete.id); setPendingDelete(null); }}

      )}
    </div>
  );
}

function AddExpenseModal({ onClose, onSave, rate }) {
  const trip = tripDayInfo();
  const [krw, setKrw] = useState('');
  const [name, setName] = useState('');
  const [cat, setCat] = useState('food');
  const [day, setDay] = useState(trip.idx + 1);
  const twd = krw ? Math.round(Number(krw) * rate) : 0;

  const submit = () => {
    if (!name.trim() || !krw) return;
    const now = new Date();
    const time = now.toTimeString().slice(0, 5);
    onSave({ day, time, cat, name: name.trim(), krw: Number(krw), twd });
  };

  return (
    <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-labelledby="exp-title">
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-body">
          <h2 id="exp-title" style={{ margin: '0 0 14px', fontSize: 18 }}>新增花費</h2>
          <div className="field">
            <label>金額 (₩ 韓元)</label>
            <input className="num-input" type="number" inputMode="numeric"
              value={krw} onChange={(e) => setKrw(e.target.value)} placeholder="0" autoFocus/>
            {krw && <div className="num" style={{ fontSize: 12, color: 'var(--gray-500)', marginTop: 4 }}>
              ≈ NT$ {twd.toLocaleString()}
            </div>}
          </div>
          <div className="field">
            <label>名稱</label>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="例:雪綠茶禮盒"/>
          </div>
          <div style={{ display: 'flex', gap: 10 }}>
            <div className="field" style={{ flex: 1 }}>
              <label>類別</label>
              <select value={cat} onChange={(e) => setCat(e.target.value)}>
                <option value="food">餐食</option>
                <option value="shop">購物</option>
                <option value="ticket">門票</option>
                <option value="other">其他</option>
              </select>
            </div>
            <div className="field" style={{ flex: 1 }}>
              <label>Day</label>
              <select value={day} onChange={(e) => setDay(Number(e.target.value))}>
                <option value={1}>Day 1 · 5/21</option>
                <option value={2}>Day 2 · 5/22</option>
                <option value={3}>Day 3 · 5/23</option>
                <option value={4}>Day 4 · 5/24</option>
                <option value={5}>Day 5 · 5/25</option>
              </select>
            </div>
          </div>
        </div>
        <div className="actions">
          <button className="btn btn-soft" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={submit}>新增</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Shopping ---------- */
function ShoppingScreen() {
  const { shopping, toggleShop, addShopItem, editShopItem, deleteShopItem } = useApp();
  const [showAdd, setShowAdd] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const editingItem = editingId
    ? (() => {
        for (const g of shopping) {
          const it = g.items.find(x => x.id === editingId);
          if (it) return { ...it, cat: g.cat };
        }
        return null;
      })()
    : null;
  const all = shopping.flatMap(g => g.items);
  const done = all.filter(i => i.done).length;
  const pct = Math.round(done / Math.max(all.length, 1) * 100);

  return (
    <div className="app screen-fade">
      <div className="app-content">
        <div style={{
          background: 'linear-gradient(135deg, var(--citrus-300) 0%, var(--citrus-100) 100%)',
          padding: '20px 20px 24px', borderBottom: '1px solid var(--line)',
        }}>
          <h1 style={{ fontSize: 26, fontWeight: 700, margin: 0, letterSpacing: '-0.02em', color: 'var(--ink)' }}>
            必買清單
          </h1>
          <div style={{ fontSize: 13, color: 'var(--citrus-700)', marginTop: 4, fontWeight: 500 }}>
            濟州在地伴手・打勾完成
          </div>
          <div style={{ marginTop: 16, background: 'rgba(255,255,255,0.6)',
            backdropFilter: 'blur(10px)', borderRadius: 14, padding: '12px 14px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <span style={{ fontSize: 13, color: 'var(--ink-soft)' }}>進度</span>
              <span className="num" style={{ fontSize: 13, fontWeight: 600, color: 'var(--citrus-700)' }}>
                {done} / {all.length}
              </span>
            </div>
            <div className="progress" style={{ marginTop: 8, background: 'rgba(255,255,255,0.7)' }}>
              <span style={{ width: `${pct}%`,
                background: 'linear-gradient(90deg, var(--citrus-500), var(--citrus-700))' }}/>

        {done === all.length && all.length > 0 ? (
          <div style={{ margin: '14px 16px 0', padding: '14px 16px',

            borderRadius: 12, display: 'flex', alignItems: 'center', gap: 12 }}>

              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: 'var(--citrus-700)' }} aria-hidden="true">
              <div style={{ width: 18, height: 18 }}>{Icons.check}</div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--ink)' }}>全部買齊!</div>
              <div style={{ fontSize: 11, color: 'var(--citrus-700)', marginTop: 2 }}>
                記得單筆 ₩15,000 以上保留收據,機場退稅
              </div>
            </div>
          </div>
        ) : (
          <div style={{ margin: '14px 16px 0', padding: '12px 14px',
            background: 'var(--sea-100)', borderRadius: 12,
            display: 'flex', alignItems: 'flex-start', gap: 10 }}>
            <div style={{ width: 18, height: 18, color: 'var(--sea-700)', marginTop: 1 }} aria-hidden="true">{Icons.info}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--sea-900)' }}>
                單筆 ₩15,000 以上可退稅
              </div>
              <div style={{ fontSize: 11, color: 'var(--sea-700)', marginTop: 2, lineHeight: 1.5 }}>
                機場退稅機可辦理・記得保留收據與護照
              </div>
            </div>
          </div>

          <div key={gi}>
            <div className="sec-label">{group.cat}</div>
            <div className="card">

                <div style={{ padding: '14px 16px', fontSize: 12, color: 'var(--gray-500)' }}>
                  尚無項目
                </div>
              )}
              {group.items.map((it, i, arr) => (
                <div key={it.id} style={{
                  display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px',
                  borderBottom: i < arr.length - 1 ? '1px solid var(--line)' : 'none',
                }} onClick={() => toggleShop(it.id)}>
                  <div className={`chk ${it.done ? 'on' : ''}`}>
                    {it.done && <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                      strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" stroke="#fff"><path d="M5 12l5 5L20 7"/></svg>}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 500,
                      color: it.done ? 'var(--gray-500)' : 'var(--ink)',
                      textDecoration: it.done ? 'line-through' : 'none' }}>
                      {it.name}
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--gray-500)', marginTop: 2,
                      display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                      <span className="num">{it.est}</span>
                      <span style={{ color: 'var(--gray-300)' }}>·</span>
                      <span>{it.where}</span>
                    </div>
                  </div>
                  {it.done && it.who && (
                    <span style={{ fontSize: 10, color: 'var(--success)',
                      background: 'rgba(74, 143, 92, 0.12)', padding: '3px 8px',
                      borderRadius: 999, fontWeight: 500 }}>
                      已買
                    </span>
                  )}
                  <button aria-label="修改/刪除"
                    onClick={(e) => { e.stopPropagation(); setEditingId(it.id); }}
                    style={{ width: 32, height: 32, borderRadius: 16, background: 'transparent',
                      border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: 'var(--gray-500)', cursor: 'pointer', flexShrink: 0 }}>
                    <div style={{ width: 18, height: 18 }}>{Icons.more}</div>
                  </button>
                </div>
              ))}
            </div>
          </div>
        ))}

        <div style={{ height: 80 }}/>
        <button className="fab" style={{ background: 'var(--citrus-700)' }} aria-label="新增項目"
          onClick={() => setShowAdd(true)}>
          <div style={{ width: 24, height: 24 }}>{Icons.plus}</div>
        </button>
      </div>

      {showAdd && <ShopEditModal
        categories={shopping.map(g => g.cat)}
        onClose={() => setShowAdd(false)}
        onSave={(cat, item) => { addShopItem(cat, item); setShowAdd(false); }}/>}

      {editingItem && <ShopEditModal
        initial={editingItem}
        categories={shopping.map(g => g.cat)}
        defaultCat={editingItem.cat}
        onClose={() => setEditingId(null)}
        onSave={(cat, fields) => {
          if (cat !== editingItem.cat) {
            // 跨類別:刪後新增
            deleteShopItem(editingItem.id);
            addShopItem(cat, fields);
          } else {
            editShopItem(editingItem.id, fields);
          }
          setEditingId(null);
        }}
        onDelete={() => { deleteShopItem(editingItem.id); setEditingId(null); }}
      />}
    </div>
  );
}

  const { tab, goTab, route } = useApp();
  const tabs = [
    { id: 'home',  label: '首頁', ic: Icons.home  },
    { id: 'itin',  label: '行程', ic: Icons.itin  },
    { id: 'money', label: '記帳', ic: Icons.money },
    { id: 'shop',  label: '必買', ic: Icons.bag   },
    { id: 'info',  label: '須知', ic: Icons.info  },
  ];
  const activeId = (route.name === 'dayDetail' || route.name === 'stopDetail') ? 'itin' : tab;
  return (
    <nav className="tabbar" role="tablist" aria-label="主導覽">
      {tabs.map(t => (
        <button key={t.id} className={`tab ${activeId === t.id ? 'active' : ''}`}
          role="tab" aria-selected={activeId === t.id}
          aria-current={activeId === t.id ? 'page' : undefined}
          aria-label={t.label}
          onClick={() => goTab(t.id)}>
          <div style={{ width: 22, height: 22 }} aria-hidden="true">{t.ic}</div>
          {t.label}
        </button>
      ))}
    </nav>
  );
}

/* ---------- App Root ---------- */
function AppRoot() {
  const { tab, route } = useApp();
  const phoneRef = useRef(null);

  // Tab / 路由切換時 scroll 回頂(找 .app-content)
  useEffect(() => {
    const el = phoneRef.current?.querySelector('.app-content');
    if (el) el.scrollTo({ top: 0, behavior: 'instant' in el ? 'instant' : 'auto' });
  }, [tab, route]);

  let screen;
  if (route.name === 'dayDetail') {
    screen = <DayDetailScreen dayN={route.day}/>;
  } else if (route.name === 'stopDetail') {
    screen = <StopDetailScreen dayN={route.day} stopIdx={route.stop}/>;
  } else if (tab === 'home')  screen = <HomeScreen/>;
  else if (tab === 'itin')    screen = <ItineraryScreen/>;
  else if (tab === 'money')   screen = <ExpensesScreen/>;
  else if (tab === 'shop')    screen = <ShoppingScreen/>;
  else if (tab === 'info')    screen = <InfoScreen/>;
  return (
    <div className="phone" ref={phoneRef}>
      {screen}
      <TabBar/>
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <AppRoot/>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
