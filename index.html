/* Jeju Trip App — Single-page React app

/* ---------- Trip day calculator ---------- */
// 旅遊期間 2026/5/21 – 5/25,依當下日期判斷顯示哪一天
function tripDayInfo() {
  const start = new Date(2026, 4, 21); // 月份 0-indexed,4 = May
  start.setHours(0, 0, 0, 0);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - start) / 86400000);
  if (diff < 0) return { idx: 0, phase: 'pre',  daysUntil: -diff };
  if (diff > 4) return { idx: 4, phase: 'post' };
  return { idx: diff, phase: 'live' };
}

/* ---------- localStorage hook ---------- */
function useLocalState(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

/* ---------- Common pieces ---------- */
function Pill({ children, kind }) {
  return <span className={`pill ${kind || ''}`}>{children}</span>;
}

function ImgPlaceholder({ label, h = 110, tone = 'sea' }) {
  const bg = tone === 'citrus'
    ? 'repeating-linear-gradient(-45deg, var(--citrus-100) 0 8px, rgba(244,197,138,0.5) 8px 16px)'
    : undefined;
  return <div className="imgph" style={{ height: h, background: bg }}>{label}</div>;
}

function Donut({ data, size = 110 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = size / 2 - 12;
  const c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-soft)" strokeWidth="14" />
      {data.map((d, i) => {
        const len = (d.value / total) * c;
        const dash = `${len} ${c - len}`;
        const offset = c - acc;
        acc += len;
        return (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
            stroke={d.color} strokeWidth="14" strokeDasharray={dash}
            strokeDashoffset={offset} transform={`rotate(-90 ${size/2} ${size/2})`} strokeLinecap="butt" />
        );
      })}
    </svg>
  );
}

function StatusBar({ dark = false }) {
  const c = dark ? '#fff' : '#1A1A1A';
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);
  const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: false });
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: '14px 24px 6px', fontFamily: 'var(--font-num)', color: c, fontSize: 15, fontWeight: 600 }}>
      <span>{time}</span>
      <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
        <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="7" width="2.5" height="4" rx="0.5" fill={c}/><rect x="4" y="5" width="2.5" height="6" rx="0.5" fill={c}/><rect x="8" y="3" width="2.5" height="8" rx="0.5" fill={c}/><rect x="12" y="0.5" width="2.5" height="10.5" rx="0.5" fill={c}/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0.5" y="0.5" width="19" height="10" rx="2.5" stroke={c} strokeOpacity="0.4" fill="none"/><rect x="2" y="2" width="14" height="7" rx="1.2" fill={c}/></svg>
      </div>
    </div>
  );
}

/* ---------- Toast ---------- */
function Toast({ msg, kind, onDone }) {
  useEffect(() => {
    if (!msg) return;
    const t = setTimeout(onDone, 1800);
    return () => clearTimeout(t);
  }, [msg, onDone]);
  if (!msg) return null;
  return <div className={`toast ${kind || ''}`}>{msg}</div>;
}

/* ---------- App Context ---------- */
const AppCtx = React.createContext(null);

function AppProvider({ children }) {
  const T = window.TRIP;

  const [expenses, setExpenses] = useLocalState('jeju.expenses', T.expenses);
  const [shopping, setShopping] = useLocalState('jeju.shopping', T.shopping);
  const [packList, setPackList] = useLocalState('jeju.pack', T.notices.pack);
  const [budget, setBudget] = useLocalState('jeju.budget', T.budget);
  const [rate] = useLocalState('jeju.rate', T.rate);

  const [tab, setTab] = useState('home');
  const [route, setRoute] = useState({ name: 'tab' });
  const [toast, setToastState] = useState({ msg: '', kind: '' });

  const showToast = useCallback((msg, kind = '') => setToastState({ msg, kind }), []);
  const goTab = useCallback((id) => { setTab(id); setRoute({ name: 'tab' }); }, []);
  const openDay = useCallback((dayN) => setRoute({ name: 'dayDetail', day: dayN }), []);
  const goBack = useCallback(() => setRoute({ name: 'tab' }), []);

  const togglePack = (idx) => {
    setPackList(prev => prev.map((p, i) => i === idx ? { ...p, done: !p.done } : p));
  };

  const toggleShop = (id) => {
    setShopping(prev => prev.map(g => ({
      ...g,
      items: g.items.map(it => it.id === id
        ? { ...it, done: !it.done, who: !it.done ? '自己' : undefined }
        : it),
    })));
  };

  const addExpense = (e) => {
    setExpenses(prev => [...prev, { ...e, id: Date.now() }]);
    showToast('已新增花費');
  };
  const deleteExpense = (id) => {
    setExpenses(prev => prev.filter(e => e.id !== id));
    showToast('已刪除');
  };

  const addShopItem = (cat, item) => {
    setShopping(prev => prev.map(g => g.cat === cat
      ? { ...g, items: [...g.items, { ...item, id: 's' + Date.now(), done: false }] }
      : g));
    showToast('已新增必買項目');
  };

  const value = {
    T, expenses, shopping, packList, budget, rate,
    tab, goTab, route, openDay, goBack,
    togglePack, toggleShop, addExpense, deleteExpense, addShopItem,
    setBudget, showToast,
  };

  return (
    <AppCtx.Provider value={value}>
      {children}
      <Toast msg={toast.msg} kind={toast.kind} onDone={() => setToastState({ msg: '', kind: '' })} />
    </AppCtx.Provider>
  );
}

const useApp = () => React.useContext(AppCtx);

            </div>
            <div style={{ fontSize: 11, color: 'var(--gray-500)' }} className="num">15° / 22°</div>

        </div>

        <div className="sec-label">{todayLabel}</div>

          <div style={{ padding: '14px 16px 10px', display: 'flex', alignItems: 'center', gap: 12 }}>
            <div className="day-chip">

              <span className="l">DAY</span>

            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 16, fontWeight: 600 }}>{today.title}</div>
              <div style={{ fontSize: 12, color: 'var(--gray-500)', marginTop: 2 }}>

          </div>

            <div className="progress"><span style={{ width: `${spentPct}%` }}/></div>

/* ---------- Expenses ---------- */
const CAT_META = {
  food:   { label: '餐食', color: 'var(--citrus-500)', icon: Icons.utensils, bg: 'var(--citrus-100)', fg: 'var(--citrus-700)' },
  shop:   { label: '購物', color: 'var(--sea-500)',    icon: Icons.bag,      bg: 'var(--sea-100)',    fg: 'var(--sea-700)' },
  ticket: { label: '門票', color: 'var(--sea-900)',    icon: Icons.pin,      bg: 'var(--bg-soft)',    fg: 'var(--gray-700)' },
  other:  { label: '其他', color: 'var(--gray-500)',   icon: Icons.info,     bg: 'var(--bg-soft)',    fg: 'var(--gray-700)' },
};

function ExpensesScreen() {
  const { T, expenses, budget, rate, addExpense, deleteExpense } = useApp();
  const [showAdd, setShowAdd] = useState(false);

  const totals = useMemo(() => expenses.reduce((s, e) => {
    s.krw += e.krw; s.twd += e.twd;
    s.byCat[e.cat] = (s.byCat[e.cat] || 0) + e.twd;
    return s;
  }, { krw: 0, twd: 0, byCat: {} }), [expenses]);

  const donutData = Object.entries(totals.byCat).map(([k, v]) => ({
    label: CAT_META[k].label, value: v, color: CAT_META[k].color
  }));

  const byDay = useMemo(() => {
    const m = {};
    expenses.forEach(e => { (m[e.day] = m[e.day] || []).push(e); });
    return m;
  }, [expenses]);

  const pct = Math.min(100, Math.round(totals.twd / budget.total * 100));

  return (
    <div className="app screen-fade">
      <div className="app-content">
        <div className="page-header">
          <h1>記帳</h1>
          <div className="sub">韓元 ↔ 台幣 即時換算</div>
        </div>

        <div className="card">
          <div className="card-pad">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div>
                <div style={{ fontSize: 11, color: 'var(--gray-500)', letterSpacing: '0.1em' }}>已花費</div>
                <div className="num" style={{ fontSize: 28, fontWeight: 700, color: 'var(--ink)', lineHeight: 1.1, marginTop: 2 }}>
                  NT$ {totals.twd.toLocaleString()}
                </div>
                <div className="num" style={{ fontSize: 12, color: 'var(--gray-500)', marginTop: 4 }}>
                  ≈ ₩ {totals.krw.toLocaleString()}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 11, color: 'var(--gray-500)' }}>預算</div>
                <div className="num" style={{ fontSize: 16, color: 'var(--gray-700)', fontWeight: 600 }}>
                  {budget.total.toLocaleString()}
                </div>
              </div>
            </div>
            <div className="progress" style={{ marginTop: 12 }}>
              <span style={{ width: `${pct}%` }}/>
            </div>
            <div className="num" style={{ fontSize: 11, color: 'var(--gray-500)', marginTop: 6 }}>
              剩 NT$ {(budget.total - totals.twd).toLocaleString()} · 1 KRW = {rate} TWD
            </div>
          </div>
        </div>

        {expenses.length > 0 && (
          <>
            <div className="sec-label">分類佔比</div>
            <div className="card">
              <div className="card-pad" style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
                <Donut data={donutData} size={110}/>
                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {donutData.map((d, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }}>
                      <span style={{ width: 8, height: 8, borderRadius: 2, background: d.color }}/>
                      <span style={{ flex: 1 }}>{d.label}</span>
                      <span className="num" style={{ color: 'var(--gray-700)' }}>
                        {Math.round(d.value / totals.twd * 100)}%
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </>
        )}

        <div className="sec-label">最近紀錄</div>
        {expenses.length === 0 && (
          <div className="empty">
            <div className="ico"><div style={{ width: 28, height: 28 }}>{Icons.money}</div></div>
            <div className="em-title">還沒有紀錄</div>
            <div className="em-sub">點右下角 + 新增第一筆</div>
          </div>
        )}
        {Object.entries(byDay).sort((a, b) => Number(b[0]) - Number(a[0])).map(([day, items]) => (
          <div key={day} className="card">
            <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'space-between',
              alignItems: 'center', background: 'var(--bg-soft)' }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink-soft)' }}>
                Day {day} · {T.days[day-1]?.date}
              </span>
              <span className="num" style={{ fontSize: 12, color: 'var(--gray-700)', fontWeight: 600 }}>
                NT$ {items.reduce((s, i) => s + i.twd, 0).toLocaleString()}
              </span>
            </div>
            {items.map(e => {
              const m = CAT_META[e.cat] || CAT_META.other;
              return (
                <div key={e.id} className="exp-row"
                  onClick={() => { if (confirm(`刪除「${e.name}」?`)) deleteExpense(e.id); }}
                  style={{ cursor: 'pointer' }}>
                  <div className="exp-icon" style={{ background: m.bg, color: m.fg }}>
                    <div style={{ width: 18, height: 18 }}>{m.icon}</div>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 500,
                      whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {e.name}
                    </div>
                    <div className="num" style={{ fontSize: 11, color: 'var(--gray-500)', marginTop: 1 }}>
                      {e.time} · {m.label}
                    </div>
                  </div>
                  <div className="exp-amount">
                    <div className="krw">₩ {e.krw.toLocaleString()}</div>
                    <div className="twd">NT$ {e.twd.toLocaleString()}</div>
                  </div>
                </div>
              );
            })}
          </div>
        ))}

        <div style={{ height: 80 }}/>
        <button className="fab" aria-label="新增花費" onClick={() => setShowAdd(true)}>
          <div style={{ width: 24, height: 24 }}>{Icons.plus}</div>
        </button>
      </div>

      {showAdd && <AddExpenseModal onClose={() => setShowAdd(false)} onSave={(e) => { addExpense(e); setShowAdd(false); }} rate={rate}/>}
    </div>
  );
}

function AddExpenseModal({ onClose, onSave, rate }) {
  const [krw, setKrw] = useState('');
  const [name, setName] = useState('');
  const [cat, setCat] = useState('food');
  const [day, setDay] = useState(2);
  const twd = krw ? Math.round(Number(krw) * rate) : 0;

  const submit = () => {
    if (!name.trim() || !krw) return;
    const now = new Date();
    const time = now.toTimeString().slice(0, 5);
    onSave({ day: Number(day), time, cat, name: name.trim(), krw: Number(krw), twd });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <h3>新增花費</h3>
        <div className="field">
          <label>金額 (₩ 韓元)</label>
          <input className="num-input" type="number" inputMode="numeric"
            value={krw} onChange={(e) => setKrw(e.target.value)} placeholder="0" autoFocus/>
          {krw && <div className="num" style={{ fontSize: 12, color: 'var(--gray-500)', marginTop: 4 }}>
            ≈ NT$ {twd.toLocaleString()}
          </div>}
        </div>
        <div className="field">
          <label>名稱</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="例:雪綠茶禮盒"/>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <div className="field" style={{ flex: 1 }}>
            <label>類別</label>
            <select value={cat} onChange={(e) => setCat(e.target.value)}>
              <option value="food">餐食</option>
              <option value="shop">購物</option>
              <option value="ticket">門票</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div className="field" style={{ flex: 1 }}>
            <label>Day</label>
            <select value={day} onChange={(e) => setDay(e.target.value)}>
              <option value={1}>Day 1 · 5/21</option>
              <option value={2}>Day 2 · 5/22</option>
              <option value={3}>Day 3 · 5/23</option>
              <option value={4}>Day 4 · 5/24</option>
              <option value={5}>Day 5 · 5/25</option>
            </select>
          </div>
        </div>
        <div className="actions">
          <button className="btn btn-soft" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={submit}>新增</button>
        </div>
      </div>
    </div>
  );
}

          <div className="card-pad" style={{ paddingTop: 6, paddingBottom: 6 }}>
            <ul style={{ margin: 0, padding: 0, listStyle: 'none' }}>
              {N.rules.map((r, i) => (
                <li key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10,
                  padding: '10px 0', borderBottom: i < N.rules.length - 1 ? '1px solid var(--line)' : 'none',
                  fontSize: 13, color: 'var(--ink-soft)', lineHeight: 1.5 }}>
                  <span style={{ width: 5, height: 5, borderRadius: 3, background: 'var(--sea-500)',
                    flexShrink: 0, marginTop: 7 }}/>
                  <span style={{ flex: 1 }}>{r}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>

        <div className="sec-label">保險</div>
        <div className="card">
          <div className="lrow">
            <div style={{ width: 28, height: 28, borderRadius: 8, background: 'rgba(74,143,92,0.18)',
              color: 'var(--success)', display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexShrink: 0 }}>
              <div style={{ width: 14, height: 14 }}>{Icons.check}</div>
            </div>
            <div style={{ flex: 1 }}>
              <div className="lt">已投保</div>
              <div className="ld">{N.insurance.contract}</div>
            </div>
          </div>
          <div className="lrow">
            <div style={{ width: 28, height: 28, borderRadius: 8, background: 'var(--citrus-100)',
              color: 'var(--citrus-700)', display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexShrink: 0, fontSize: 14, fontWeight: 700 }}>!</div>
            <div style={{ flex: 1 }}>
              <div className="lt">建議自行加保</div>
              <div className="ld">{N.insurance.personal}</div>
            </div>
          </div>
        </div>

        <div className="sec-label">緊急聯絡</div>
        <div className="card">
          {N.emergency.map((e, i, arr) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px',
              borderBottom: i < arr.length - 1 ? '1px solid var(--line)' : 'none',
              cursor: 'pointer',
            }} onClick={() => callPhone(e.phone)}>
              <div style={{ width: 36, height: 36, borderRadius: 10,
                background: 'var(--danger)',
                display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff"
                  strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M22 16.92V21a1 1 0 01-1.1 1A19 19 0 012 4.1 1 1 0 013 3h4.1a1 1 0 011 .75l1 4a1 1 0 01-.3 1L7.2 10.2a16 16 0 006.6 6.6l1.4-1.5a1 1 0 011-.3l4 1a1 1 0 01.8 1z"/>
                </svg>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 500 }}>{e.name}</div>
                <div className="num" style={{ fontSize: 12, color: 'var(--gray-500)', marginTop: 1 }}>
                  {e.phone}
                </div>
              </div>
              <div style={{ width: 14, height: 14, color: 'var(--gray-300)' }}>{Icons.chev}</div>
            </div>
          ))}
        </div>

        <div className="sec-label">退稅小幫手</div>
        <div className="card">
          <div className="card-pad">
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>{N.refund.threshold}</div>
            <div style={{ fontSize: 12, color: 'var(--gray-500)', marginBottom: 12 }}>{N.refund.where}</div>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--gray-700)',
              letterSpacing: '0.1em', marginBottom: 6 }}>需備文件</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {N.refund.docs.map((d, i) => (
                <span key={i} style={{ fontSize: 12, background: 'var(--bg-soft)',
                  color: 'var(--ink-soft)', padding: '5px 10px', borderRadius: 999 }}>
                  {d}
                </span>
              ))}
            </div>
          </div>
        </div>

        {T.contacts && T.contacts.length > 0 && (
          <>
            <div className="sec-label">福委會聯絡人</div>
            <div className="card">
              {T.contacts.map((c, i, arr) => (
                <div key={i} className="lrow" style={{
                  borderBottom: i < arr.length - 1 ? '1px solid var(--line)' : 'none' }}>
                  <div style={{ width: 28, height: 28, borderRadius: 8, background: 'var(--bg-soft)',
                    color: 'var(--gray-700)', display: 'flex', alignItems: 'center',
                    justifyContent: 'center', fontSize: 12, fontWeight: 600, flexShrink: 0 }}>
                    {c.name[0]}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div className="lt">{c.name}</div>
                    <div className="ld num">分機 {c.ext}</div>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}

        <div style={{ height: 16 }}/>
      </div>
    </div>
  );
}

/* ---------- Tab Bar ---------- */
function TabBar() {
  const { tab, goTab, route } = useApp();
  const tabs = [
    { id: 'home',  label: '首頁', ic: Icons.home  },
    { id: 'itin',  label: '行程', ic: Icons.itin  },
    { id: 'money', label: '記帳', ic: Icons.money },
    { id: 'shop',  label: '必買', ic: Icons.bag   },
    { id: 'info',  label: '須知', ic: Icons.info  },
  ];
  const activeId = route.name === 'dayDetail' ? 'itin' : tab;
  return (
    <div className="tabbar">
      {tabs.map(t => (
        <button key={t.id} className={`tab ${activeId === t.id ? 'active' : ''}`} onClick={() => goTab(t.id)}>
          <div style={{ width: 22, height: 22 }}>{t.ic}</div>
          {t.label}
        </button>
      ))}
    </div>
  );
}

/* ---------- App Root ---------- */
function AppRoot() {
  const { tab, route } = useApp();
  let screen;
  if (route.name === 'dayDetail') {
    screen = <DayDetailScreen dayN={route.day}/>;
  } else if (tab === 'home')  screen = <HomeScreen/>;
  else if (tab === 'itin')    screen = <ItineraryScreen/>;
  else if (tab === 'money')   screen = <ExpensesScreen/>;
  else if (tab === 'shop')    screen = <ShoppingScreen/>;
  else if (tab === 'info')    screen = <InfoScreen/>;
  return (
    <div className="phone">
      {screen}
      <TabBar/>
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <AppRoot/>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
